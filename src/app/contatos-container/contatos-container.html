
<form>
    <h1 style="color: red;">Contato</h1>
    <p>
        <i>Seja bem vindo, prencha o <strong>formulário</strong> abaixo para:</i>
    </p><br>

    <ul>
        <li>duvidas</li>
        <li>sugestões</li>
        <li>criticas</li>
        <li>orçamentos</li>
    </ul><br>

    <p>
        Caso queira ver nosso produtos, clique <a href="https://www.google.com">aqui</a>
    </p><br>

    <label for="nome">Nome</label>
    <input id="nome" type="text" placeholder="Digite seu nome" required><br>

    <label for="email">E-mail</label>
    <input id="email" type="email" placeholder="Digite seu e-mail"><br>

    <label for="telefone">Telefone</label>
    <input id="telefone" type="tel" placeholder="(11)99999-9999" required><br>

    <label for="assunto">Assunto</label>
    <select id="assunto" multiple>
        <option>duvidas</option>
        <option>sugestões</option>
        <option>criticas</option>
        <option>orçamentos</option>
    </select><br>

    <p>Deseja receber uma copia deste e-mail:</p>
    <input type="radio">Sim
    <input type="radio">Não<br>

    <label for="mensagem">Mensagem:</label>
    <textarea id="mensagem" placeholder="Digite sua mensagem aqui..."></textarea><br>

    <button>Enviar</button>

</form>
